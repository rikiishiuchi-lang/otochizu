<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>録音を開く</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;font:17px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:light-dark(#f2f2f7,#000);color:light-dark(#1c1c1e,#f2f2f7)}
main{padding:28px;text-align:center;max-width:340px}
p{margin:0 0 18px;color:light-dark(#6b6b70,#a1a1a6);font-size:15px}
a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;background:#007aff;color:#fff;font-weight:600;text-decoration:none}
a i{width:11px;height:11px;border-radius:50%;background:#ff3b30}
</style></head><body><main>
<p id="msg">録音を開いています…</p>
<a id="go" href="#"><i></i><span id="lab">開く</span></a>
</main>
<script>
// このページは、決まった2種類のリンク（ショートカットを動かす／ボイスメモを開く）にだけ移る
(function(){
  var q=new URLSearchParams(location.search),n=(q.get("n")||"").slice(0,60),open=q.get("m")==="open";
  var url=open||!n?"voicememos://":"shortcuts://run-shortcut?name="+encodeURIComponent(n);
  var go=document.getElementById("go");go.href=url;
  document.getElementById("lab").textContent=open||!n?"ボイスメモを開く":"「"+n+"」を動かす";
  setTimeout(function(){location.href=url},150);
  setTimeout(function(){document.getElementById("msg").textContent="開かないときは、下のボタンを押す。終わったらこのページは閉じてよい。"},1500);
})();
</script></body></html>
